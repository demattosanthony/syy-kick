services:
  pg:
    container_name: postgres_db
    image: pgvector/pgvector:pg14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  mini_io:
    container_name: minio
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  unstructured-api:
    container_name: unstructured-api
    image: downloads.unstructured.io/unstructured-io/unstructured-api:latest
    ports:
      - "8000:8000"
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - app-network

  # doc-worker:
  #   build:
  #     context: ./api
  #     dockerfile: Dockerfile.doc-worker
  #   environment:
  #     - DATABASE_URL=postgresql://postgres:postgres@postgres_db:5432/postgres
  #     - UNSTRUCTURED_API_URL=http://unstructured-api:8000/general/v0/general
  #     - UNSTRUCTURED_API_KEY=sk-tester-key
  #     - S3_BUCKET_NAME=my-new-bucket
  #     - S3_ACCESS_KEY_ID=minioadmin
  #     - S3_SECRET_ACCESS_KEY=minioadmin123
  #     - S3_ENDPOINT_URL=http://minio:9000
  #     - OPENAI_API_KEY=${OPENAI_API_KEY}
  #   ports:
  #     - "4200:4200"
  #   networks:
  #     - app-network
  #   depends_on:
  #     - pg
  #     - mini_io
  #     - unstructured-api

volumes:
  pg_data:
    driver: local
  minio_data:
    driver: local

networks:
  app-network:
    driver: bridge
